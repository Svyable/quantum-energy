name: r2-calibration-components

on:
  pull_request:
    paths:
      - 'models/r2_calibration_component_estimator_v3_19.py'
      - 'models/r2_calibration_component_test_v3_19.py'
      - 'models/fixtures/r2_calibration_repeats_template_v3_19.csv'
      - 'models/r2_covariance_power_v3_18.py'
      - '.github/workflows/r2-calibration-components.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12','3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile models/r2_calibration_component_estimator_v3_19.py models/r2_calibration_component_test_v3_19.py
      - name: Synthetic recovery + independent propagation checks
        run: python models/r2_calibration_component_test_v3_19.py
      - name: Template parses as schema
        run: |
          python - <<'PY'
          import csv
          p='models/fixtures/r2_calibration_repeats_template_v3_19.csv'
          with open(p,newline='') as h:
              r=csv.DictReader(h)
              assert set(r.fieldnames)=={'session_id','sweep_id','sequence_index','target_suns','calibrated_suns','qc_status'}
          print('PASS schema')
          PY
