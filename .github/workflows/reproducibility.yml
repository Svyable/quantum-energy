name: scientific-reproducibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publication-gate:
    name: Python ${{ matrix.python }} / ${{ matrix.stack }}
    # Pin the OS family/version rather than the mutable ubuntu-latest alias.
    # GitHub-hosted runner image contents can still change; ImageOS/ImageVersion
    # and a full runtime fingerprint are recorded below on every run.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        stack: [baseline, current]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The provenance verifier checks that its frozen anchor commit is an
          # ancestor of HEAD; shallow history cannot establish that relation.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/ci-${{ matrix.stack }}.txt
      - name: Install frozen scientific stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci-${{ matrix.stack }}.txt
      - name: Verify scientific provenance and record runtime fingerprint
        run: |
          python tools/verify_provenance.py \
            --stack "${{ matrix.stack }}" \
            --write-runtime /tmp/scientific-runtime.json
          {
            echo '## Scientific runtime fingerprint'
            echo '```json'
            cat /tmp/scientific-runtime.json
            echo '```'
            echo '## Runner OS release'
            echo '```text'
            cat /etc/os-release
            echo 'ImageOS='"${ImageOS:-unset}"
            echo 'ImageVersion='"${ImageVersion:-unset}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate and independently cross-check SHA-256 fixture manifest
        shell: bash
        run: |
          python tools/generate_scientific_attestation_manifest.py \
            --output /tmp/scientific-fixtures-v3.11.sha256.json
          python - <<'PY' >/tmp/scientific-fixtures.sha256
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/scientific-fixtures-v3.11.sha256.json').read_text())
          for item in m['files']:
              print(f"{item['sha256']}  {item['path']}")
          PY
          sha256sum -c /tmp/scientific-fixtures.sha256
      - name: Run publication reproducibility gate
        run: python tests/reproducibility_gate.py
      - name: Re-run published DeltaVnr benchmark
        run: |
          cp models/delta_vnr_literature_benchmark_v3_8.csv /tmp/delta-vnr-before.csv
          python models/delta_vnr_literature_benchmark.py
          python - <<'PY'
          from pathlib import Path
          before = Path('/tmp/delta-vnr-before.csv').read_text(encoding='utf-8').replace('\r\n', '\n')
          after = Path('models/delta_vnr_literature_benchmark_v3_8.csv').read_text(encoding='utf-8').replace('\r\n', '\n')
          if before != after:
              raise SystemExit('regenerated benchmark CSV differs beyond newline convention')
          print('DELTA_VNR_FROZEN_CSV=PASS')
          PY
      - name: Raw-spectrum deterministic smoke run
        run: |
          rm -rf /tmp/r2-raw-spectrum-ci
          python models/r2_raw_spectrum_harness.py --outdir /tmp/r2-raw-spectrum-ci --nsim 8 --seed 20260826
          test -s /tmp/r2-raw-spectrum-ci/metadata.json
          test -s /tmp/r2-raw-spectrum-ci/linewidth_recovery_summary.csv
