name: baseline-stress-capability-v373

on:
  pull_request:
    paths:
      - 'machine/baseline-stress-capability-v3.73.json'
      - 'models/baseline_stress_capability_v373.py'
      - 'models/baseline_stress_capability_fixture_v373.csv'
      - 'technical/baseline-stress-capability-v3.73.md'
      - '.github/workflows/baseline-stress-capability-v373.yml'
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run baseline capability fixture
        run: |
          python models/baseline_stress_capability_v373.py \
            models/baseline_stress_capability_fixture_v373.csv \
            --output-json /tmp/v373.json
      - name: Check expected values and fail-closed behavior
        run: |
          python - <<'PY'
          import csv, json, math, statistics, tempfile
          from pathlib import Path
          from statistics import NormalDist
          import subprocess, sys

          out=json.load(open('/tmp/v373.json'))
          assert out['status']=='BASELINE_CAPABILITY_ESTIMATED'
          assert out['physical_result']=='NONE_BASELINE_CAPABILITY_ONLY'
          assert out['physical_thresholds']=='DEFERRED_UNTIL_REAL_BASELINE_PLUS_USEFUL_WORK_MARGIN'
          assert len(out['common_lots'])==5

          rows=list(csv.DictReader(open('models/baseline_stress_capability_fixture_v373.csv')))
          by={}
          for r in rows:
              key=(r['arm'],r['stress'],r['lot_id'])
              by.setdefault(key,[]).append(math.log(float(r['after'])/float(r['before'])))
          cell_sds=[]
          for arm in ('A0','B0'):
              for stress in ('T','L'):
                  lots=[]
                  for lot in sorted({r['lot_id'] for r in rows}):
                      vals=by[(arm,stress,lot)]
                      lots.append(sum(vals)/len(vals))
                  cell_sds.append(statistics.stdev(lots))
          s=max(cell_sds)
          assert math.isclose(s,0.019162463307205564,rel_tol=0,abs_tol=1e-12)
          assert math.isclose(out['s_base'],s,rel_tol=0,abs_tol=1e-12)

          z=NormalDist().inv_cdf(0.975)+NormalDist().inv_cdf(0.8)
          mde=z*2*s/math.sqrt(5)
          assert math.isclose(mde,0.04801756877188166,rel_tol=0,abs_tol=1e-12)
          target=next(x for x in out['planning_frontier'] if x['variance_multiplier']==1.0 and x['future_lots_per_arm']==5)
          assert math.isclose(target['mde_log_interaction'],mde,rel_tol=0,abs_tol=1e-12)
          assert math.isclose(target['mde_ratio_of_ratios_minus_1'],math.exp(mde)-1,rel_tol=0,abs_tol=1e-12)

          # Fail closed if a required calibration field is false.
          bad=[dict(r) for r in rows]
          bad[0]['calibration_complete']='false'
          with tempfile.TemporaryDirectory() as td:
              p=Path(td)/'bad.csv'
              with p.open('w',newline='') as h:
                  w=csv.DictWriter(h,fieldnames=rows[0].keys(),lineterminator='\n')
                  w.writeheader(); w.writerows(bad)
              proc=subprocess.run([sys.executable,'models/baseline_stress_capability_v373.py',str(p)],capture_output=True,text=True)
              assert proc.returncode==2
              assert 'INCOMPLETE' in proc.stdout
          print('independent v3.73 capability checks: PASS')
          PY
