name: r2-reciprocity-concordance

on:
  pull_request:
    paths:
      - 'models/r2_reciprocity_concordance_v3_37.py'
      - 'technical/data/r2_reciprocity_concordance_protocol_v3_37.json'
      - 'technical/data/r2_reciprocity_concordance_raw_template_v3_37.csv'
      - 'technical/r2-reciprocity-concordance-v3.37.md'
      - '.github/workflows/r2-reciprocity-concordance.yml'
  workflow_dispatch:

jobs:
  verify:
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run executable self-test
        run: python models/r2_reciprocity_concordance_v3_37.py --self-test
      - name: Independent contract checks
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          p=json.loads(Path('technical/data/r2_reciprocity_concordance_protocol_v3_37.json').read_text())
          assert p['primary_gate']['threshold_mV'] == 20.0
          assert p['uncertainty_diagnostic']['required_rho_sensitivity'] == [-0.5,0.0,0.5]
          with Path('technical/data/r2_reciprocity_concordance_raw_template_v3_37.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==1
          # Separate arithmetic route from the executable module.
          d=120.0-100.0
          assert abs(d)==20.0
          var=3.0**2+4.0**2-2*0.0*3.0*4.0
          assert abs(math.sqrt(var)-5.0) < 1e-12
          assert rows[0]['configuration_match']=='UNKNOWN'
          print('independent contract checks PASS')
          PY
