name: epc-attribution-bound-v357

on:
  pull_request:
    paths:
      - 'models/epc_attribution_bound_v357.py'
      - 'research/benchmarks/epc-attribution-bound-v3.57.json'
      - 'research/benchmarks/epc-attribution-bound-v3.57.md'
      - '.github/workflows/epc-attribution-bound-v357.yml'
  workflow_dispatch:

jobs:
  reproduce:
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run EPC attribution bound
        run: python models/epc_attribution_bound_v357.py
