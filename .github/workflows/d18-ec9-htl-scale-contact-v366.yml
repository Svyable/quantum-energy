name: d18-ec9-htl-scale-contact-v366

on:
  pull_request:
    paths:
      - 'research/benchmarks/d18-ec9-htl-scale-contact-bound-v3.66.json'
      - 'research/benchmarks/d18-ec9-htl-scale-contact-bound-v3.66.md'
      - 'models/d18_ec9_htl_scale_contact_bound_v366.py'
      - '.github/workflows/d18-ec9-htl-scale-contact-v366.yml'
  workflow_dispatch:

jobs:
  reproduce:
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reproduce v3.66 benchmark
        run: python models/d18_ec9_htl_scale_contact_bound_v366.py
