name: weak-el-facility-export

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-facility-export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate synthetic package and independent failure controls
        run: |
          python tools/validate_weak_el_export.py examples/weak_el_facility_export_v1 --expect-synthetic
          python tests/facility_export_gate.py
      - name: Explain claim boundary
        run: |
          {
            echo '## Weak-EL facility export gate'
            echo 'PASS means the package schema, hashes, units, bin-width handling, and synthetic arithmetic are internally reproducible.'
            echo 'It does **not** validate a real facility calibration, detector physics, reciprocity, R2 stability, EPC, or energy-conversion performance.'
          } >> "$GITHUB_STEP_SUMMARY"
