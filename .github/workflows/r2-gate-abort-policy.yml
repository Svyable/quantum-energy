name: r2-gate-abort-policy

on:
  pull_request:
    paths:
      - 'technical/data/r2_gate_abort_policy_v3_33.json'
      - 'technical/data/r2_facility_capability_contract_v3_27.json'
      - 'models/r2_gate_abort_policy_v3_33.py'
      - 'technical/r2-gate-abort-policy-v3.33.md'
      - '.github/workflows/r2-gate-abort-policy.yml'
  workflow_dispatch:

jobs:
  validate:
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run primary policy validator
        run: python models/r2_gate_abort_policy_v3_33.py
      - name: Independent JSON-only dependency check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          p = json.loads((root/'technical/data/r2_gate_abort_policy_v3_33.json').read_text())
          s = json.loads((root/'technical/data/r2_facility_capability_contract_v3_27.json').read_text())
          pm = {g['id']: set(g['depends_on']) for g in p['gates']}
          assert len(p['gates']) == 9
          for gid, deps in s['gate_dependencies'].items():
              assert pm[gid] == set(deps), (gid, pm[gid], deps)
          assert pm['packet_preflight'] == set()
          # Independent root reachability: every policy gate must trace to packet_preflight
          for gid in pm:
              seen = set()
              stack = [gid]
              reached = gid == 'packet_preflight'
              while stack:
                  cur = stack.pop()
                  for d in pm[cur]:
                      if d == 'packet_preflight': reached = True
                      if d not in seen and d in pm:
                          seen.add(d); stack.append(d)
              assert reached, gid
          print('independent dependency check PASS')
          PY
