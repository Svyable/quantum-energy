name: d18-ec9-durability-stress-mode-v369

on:
  pull_request:
    paths:
      - 'research/benchmarks/d18-ec9-durability-stress-mode-v3.69.json'
      - 'models/d18_ec9_durability_stress_mode_v369.py'
      - 'technical/d18-ec9-durability-stress-mode-v3.69.md'
      - '.github/workflows/d18-ec9-durability-stress-mode-v369.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run durability stress-mode benchmark
        run: python models/d18_ec9_durability_stress_mode_v369.py
