name: pto2-y1-field-generation-v355
on:
  pull_request:
    paths:
      - 'models/pto2_y1_field_generation_v355.py'
      - 'research/benchmarks/pto2-y1-field-generation-v3.55.json'
      - 'research/benchmarks/pto2-y1-field-generation-v3.55.md'
      - '.github/workflows/pto2-y1-field-generation-v355.yml'
jobs:
  verify:
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python models/pto2_y1_field_generation_v355.py
